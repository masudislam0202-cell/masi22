<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37MAXIGAME - Real Time Spin Lotto</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; text-align: center; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .title { font-size: 20px; font-weight: bold; color: #f39c12; }
        .points-box { font-size: 18px; color: #2ecc71; font-weight: bold; }
        .wheel-container { position: relative; margin: 20px auto; width: 200px; height: 200px; }
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 5px solid #f39c12; }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid #e74c3c; z-index: 10; }
        .timer-box { font-size: 16px; margin: 10px 0; color: #e74c3c; }
        .bet-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; }
        .bet-btn { background: #2c3e50; color: #fff; border: none; padding: 10px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        .bet-btn.selected { background: #f39c12; }
        .bet-input { padding: 8px; border-radius: 4px; border: none; width: 80%; margin-bottom: 10px; }
        .submit-btn { background: #27ae60; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; width: 100%; cursor: pointer; }
        .submit-btn:disabled { background: #7f8c8d; }
        .history-box { background: #1e1e1e; padding: 10px; border-radius: 6px; margin-top: 15px; }
        .top-controls { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .btn-sm { background: #34495e; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="top-controls">
        <button class="btn-sm" onclick="toggleAudio()">🔊 Sound: <span id="sound-status">ON</span></button>
        <button class="btn-sm" onclick="alert('Rules: Bet 10-500 points. Bet locks 30s before spin. Lowest bet wins!')">📜 Rules</button>
    </div>

    <div class="header">
        <div class="title">37 MAXI GAME</div>
        <div class="points-box">Points: <span id="user-points">0</span></div>
    </div>

    <div class="timer-box">
        Timer: <span id="timer">00:00</span> | Status: <span id="lock-status" style="color:#2ecc71;">OPEN</span>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="200" height="200"></canvas>
    </div>

    <h3>Select Bet Choice</h3>
    <div class="bet-grid" id="betChoices"></div>

    <input type="number" id="betPoints" class="bet-input" placeholder="Points (10 - 500)" min="10" max="500">
    <button id="placeBetBtn" class="submit-btn" onclick="placeBet()">Place Bet</button>

    <div class="history-box">
        <h4>Spine Winning History</h4>
        <p id="winHistory">2, 0, 5, 0, 6, 7, 8</p>
    </div>

    <script>
        let soundEnabled = true;
        let selectedChoice = null;
        let isLocked = false;
        const tickSound = new Audio('https://actions.google.com/sounds/v1/fights/punches_impacts.ogg');

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-status').innerText = soundEnabled ? 'ON' : 'OFF';
        }

        // Draw Wheel (0-9 Demo)
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSegments = 10;
        const angle = (2 * Math.PI) / numSegments;

        for (let i = 0; i < numSegments; i++) {
            ctx.beginPath();
            ctx.fillStyle = i % 2 === 0 ? '#3498db' : '#e74c3c';
            ctx.moveTo(100, 100);
            ctx.arc(100, 100, 100, i * angle, (i + 1) * angle);
            ctx.fill();
            ctx.stroke();

            ctx.save();
            ctx.translate(100, 100);
            ctx.rotate(i * angle + angle / 2);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 14px Arial";
            ctx.fillText(i, 60, 5);
            ctx.restore();
        }

        // Generate Bet Buttons
        const choiceGrid = document.getElementById('betChoices');
        for (let i = 0; i < 10; i++) {
            let btn = document.createElement('button');
            btn.className = 'bet-btn';
            btn.innerText = i;
            btn.onclick = () => {
                document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedChoice = i;
            };
            choiceGrid.appendChild(btn);
        }

        function triggerWinAnimation() {
            if (soundEnabled) tickSound.play();
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        function placeBet() {
            let points = Number(document.getElementById('betPoints').value);
            if (selectedChoice === null) return alert("Select a choice first!");
            if (points < 10 || points > 500) return alert("Points must be between 10 and 500");
            alert(`Bet placed on ${selectedChoice} for ${points} points!`);
        }
    </script>
</body>
</html>
